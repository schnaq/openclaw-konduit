# ClawHub's half of a release, and it only ever runs as a manual dispatch.
#
# That is not a preference: ClawHub's reusable workflow accepts an OIDC token
# as the whole credential only when `github.event_name` is `workflow_dispatch`
# (package-publish.yml, "Real publishes need secrets.clawhub_token, or GitHub
# OIDC on workflow_dispatch runs"). A tag push would have to carry a ClawHub
# token in a secret instead. So release.yml dispatches this workflow at the tag
# once npm is done, and the credential stays an OIDC claim nobody has to store.
#
# This file's name is in the package's trusted publisher config; publishing
# from another workflow would break that trust.
name: ClawHub Publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview without publishing
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: decide
        name: One version in both files, and not one ClawHub already has
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pkg=$(node -p "require('./package.json').version")
          manifest=$(node -p "require('./openclaw.plugin.json').version")
          if [ "$pkg" != "$manifest" ]; then
            echo "::error::package.json $pkg, openclaw.plugin.json $manifest"
            exit 1
          fi
          latest=$(npx --yes clawhub@0.23.3 package inspect @konduiteu/openclaw --json 2>/dev/null \
            | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{try{const j=JSON.parse(s.slice(s.indexOf('{')));process.stdout.write(String(j.package?.latestVersion ?? ''))}catch{}})")
          if [ "$latest" = "$pkg" ]; then
            echo "ClawHub already has $pkg; skipping"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@9d49df109d4ad3dc8a6ecf05d26b39f46d294721
    with:
      dry_run: ${{ inputs.dry_run }}
